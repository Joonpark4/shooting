<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML</title>
    <style>
        body {
            position: relative;

        }

        .manual {
            position: absolute;
            top: 50px;
            left: 450px;
            font-size: 20px;
        }

        .title {
            font-weight: bold;
        }

        span {
            color: red;
        }

        .text {
            text-align: left;
        }

        .textbox {
            width: 80px;
            height: 25px;
            font-size: 25px;
            text-align: center;
        }

        #dot {
            position: absolute;
            left: 0;
            top: 0;
            width: 50px;
            height: 50px;
            transform: translate(-20%, -40%);
            background-color: none;
        }

        fieldset {
            margin-bottom: 35px;
        }

        canvas {
            touch-action: none;
            user-select: none;
        }

        @media (max-width: 768px), (pointer: coarse) {
            body {
                margin: 0;
                height: 100vh;
                height: 100dvh;
                display: grid;
                place-items: center;
                overflow: hidden;
                background: #000;
            }

            h3, .manual, #dot {
                display: none;
            }

            canvas {
                display: block;
                width: min(100vw, calc(100vh * 4 / 7));
                width: min(100vw, calc(100dvh * 4 / 7));
                height: auto;
            }
        }
    </style>
</head>

<body>
    <h3>Shooting Game!</h3>
    <div class="manual">
        <fieldset>
            <legend class="title">Game Explain</legend>
            <p class="text">Tank Control : keyboard <span>&lt;left&gt;</span> and <span>&lt;right&gt;</span> button</p>
            <p class="text">Tank Shooting : keyboard <span>&lt;Space Bar&gt;</span> button</p>
        </fieldset>
        <fieldset>
            <legend class="title">Game Information</legend>
            <p class="text">Enemy Speed : <input type="text" readonly class="textbox" value="0" id="EnemySpeedBox"></p>
            <p class="text">Enemy Creation Speed : <input type="text" readonly class="textbox" value="0"
                    id="EnemyCreationSpeedBox"></p>
            <p class="text">Boss Speed : <input type="text" readonly class="textbox" value="0" id="BossSpeedBox"></p>
            <p class="text">Boss Creation Speed : <input type="text" readonly class="textbox" value="0"
                    id="BossCreationSpeedBox"></p>
        </fieldset>
    </div>
    <div id="dot"></div>
    <script src="shooting.js">
    </script>
</body>

</html>
